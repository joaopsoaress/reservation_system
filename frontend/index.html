<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reservation System</h1>
            <p>Manage your available time slots</p>
        </header>

        <div class="main-content">
            <!-- Creation Form -->
            <section class="form-section">
                <h2>➕ Create New Slot</h2>
                <form id="createSlotForm" class="slot-form">
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="hour">Time:</label>
                        <input type="time" id="hour" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="duration">Duration (minutes):</label>
                        <input type="number" id="duration" value="60" min="15" step="15" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Create Slot</button>
                </form>
            </section>

            <!-- Slots List -->
            <section class="slots-section">
                <div class="section-header">
                    <h2>📅 Available Slots</h2>
                    <button id="refreshBtn" class="btn btn-secondary">🔄 Refresh</button>
                </div>
                
                <div id="loading" class="loading">Loading slots...</div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <div id="slotsContainer" class="slots-container">
                </div>
                
                <div id="noSlots" class="no-slots" style="display: none;">
                    <p>No slots available. Create the first slot above!</p>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
